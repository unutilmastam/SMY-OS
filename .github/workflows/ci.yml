# Build, unit tests, format check and static analysis (TESTING.md).
# This is the source of truth for SMY-OS: the owner has no local machine.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 clang-format-18 clang-tidy-18 \
            libclang-rt-18-dev clang lld llvm clang-format clang-tidy \
            cppcheck make python3 curl xz-utils

      - name: Check environment
        run: tools/check-env.sh

      - name: Fetch pinned Limine (SHA-256 verified)
        run: tools/fetch-limine.sh

      - name: Build kernel objects
        run: make kernel

      - name: Host unit tests (ASan + UBSan)
        run: make test

      - name: Format check
        run: make format-check

      - name: Static analysis (clang-tidy, cppcheck)
        run: make lint
