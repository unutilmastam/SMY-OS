#
# Build, unit tests, format check, static analysis, bootable ISO, QEMU boot
# tests and in-kernel self-tests (TESTING.md). This is the source of truth for
# SMY-OS: the owner does not build locally.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-18 lld-18 llvm-18 clang-format-18 clang-tidy-18 \
            libclang-rt-18-dev clang lld llvm clang-format clang-tidy \
            cppcheck make python3 curl xz-utils unzip \
            qemu-system-x86 ovmf xorriso mtools nasm \
            librsvg2-bin imagemagick fonts-dejavu-core

      - name: Check environment
        run: tools/check-env.sh --all

      - name: Fetch pinned Limine (SHA-256 verified)
        run: tools/fetch-limine.sh

      - name: Build kernel
        run: make kernel

      - name: Host unit tests (ASan + UBSan)
        run: make test

      - name: Format check
        run: make format-check

      - name: Static analysis (clang-tidy, cppcheck)
        run: make lint

      - name: Design assets (generators, SVG rules, manifest, contrast)
        run: make brand-check

      - name: Design system (palette, WCAG contrast, token code, font coverage)
        run: make design-check

      - name: Brand exports and preview sheets (PNG 16-1024 px, themes)
        run: make brand

      - name: Build hybrid ISO
        run: make iso

      - name: Boot test — BIOS, CD
        run: make boot-test-bios-cd

      - name: Boot test — BIOS, raw disk (USB stick)
        run: make boot-test-bios-disk

      - name: Boot test — UEFI, CD
        run: make boot-test-uefi-cd

      - name: Boot test — UEFI, raw disk (USB stick)
        run: make boot-test-uefi-disk

      - name: Boot screen (logo pixels via QEMU screendump) — BIOS + UEFI
        run: make boot-screen

      - name: Kernel self-tests (ktest) — BIOS
        run: make ktest-bios

      - name: Kernel self-tests (ktest) — UEFI
        run: make ktest-uefi

      - name: Physical memory with 4 GiB RAM (memory above 4 GiB)
        run: make ktest-big-memory

      - name: Kernel self-tests with SMEP and SMAP (QEMU -cpu max)
        run: make ktest-cpu-max

      - name: Kernel self-tests without HPET (timer calibrated with the PIT)
        run: make ktest-no-hpet

      - name: Keyboard - keystrokes injected through the QEMU monitor (BIOS, UEFI)
        run: make ktest-keyboard-bios ktest-keyboard-uefi

      - name: Panic reports (#UD, #PF, kernel panic, stack overflow, double kfree)
        run: >-
          make ktest-panic-ud ktest-panic-pf ktest-panic-kernel
          ktest-panic-stack-overflow ktest-panic-double-kfree

      - name: Reproducible ISO (two clean builds, same SHA-256)
        run: tools/check-reproducible.sh

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smy-os-iso-${{ github.sha }}
          path: |
            build/smy-os.iso
            build/SHA256SUMS
            build/brand/concepts-preview.png
            build/brand/logo-family.png
            build/brand/themes-preview.png
            build/generated/design/smy_tokens.h
            build/generated/design/smy_tokens.css
            build/screens/boot-bios.png
            build/screens/boot-uefi.png
          if-no-files-found: error

      - name: Upload brand exports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smy-os-brand-${{ github.sha }}
          path: build/brand/png/
          if-no-files-found: error
          retention-days: 14
