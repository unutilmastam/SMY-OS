# Documentation checks. Phase 1 adds the full build/test workflow (ci.yml).
name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative Markdown links
        run: python3 tools/check-links.py
