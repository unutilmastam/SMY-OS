#
# Limine configuration for the SMY-OS ISO (docs/install/iso-spec.md).
# Syntax: Limine CONFIG.md (12.x). Serial is on so firmware/bootloader
# messages also reach the serial log that boot tests read.

timeout: 0
serial: yes
interface_branding: SMY-OS

/SMY-OS
    protocol: limine
    path: boot():/boot/smy-kernel.elf
